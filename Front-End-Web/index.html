  <!DOCTYPE html>
  <html lang="pt-BR">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>ESCORTinRoad &mdash; Transporte e Logística</title>
      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }

        /* Splash exibido enquanto o JavaScript carrega. O React substitui o conteudo do #root ao montar. */
        .splash {
          height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #f9fafb; font-family: ui-sans-serif, system-ui, sans-serif; color: #111827; text-align: center;
        }
        .splash-scene { width: 256px; max-width: 80vw; margin-bottom: 32px; }
        .splash-truck {
          width: fit-content; margin: 0 auto; padding: 12px; border-radius: 12px; background: #ea580c;
          box-shadow: 0 10px 15px -3px rgb(234 88 12 / 0.3); position: relative; z-index: 1;
          animation: splash-bounce 0.5s ease-in-out infinite;
        }
        .splash-truck svg { display: block; width: 36px; height: 36px; }
        .splash-road {
          height: 24px; margin-top: -4px; border-radius: 9999px; background-color: #1f2937;
          background-image: linear-gradient(90deg, #fdba74 0 24px, transparent 24px 48px);
          background-size: 48px 4px; background-repeat: repeat-x; background-position: 0 center;
          animation: splash-road 0.6s linear infinite;
        }
        .splash-brand { font-weight: 700; font-size: 24px; }
        .splash-brand span { color: #ea580c; }
        .splash-tag { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #ea580c; margin-top: 2px; }
        .splash-bar { width: 192px; height: 6px; margin-top: 24px; border-radius: 9999px; background: #ffedd5; overflow: hidden; }
        .splash-bar div {
          width: 40%; height: 100%; border-radius: 9999px; background: #ea580c;
          animation: splash-progress 1.4s ease-in-out infinite;
        }
        @keyframes splash-bounce { 50% { transform: translateY(-3px); } }
        @keyframes splash-road { to { background-position: -48px center; } }
        @keyframes splash-progress { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) {
          .splash-truck, .splash-road, .splash-bar div { animation: none; }
        }
      </style>
    </head>

    <body>
      <div id="root">
        <div class="splash" role="status" aria-live="polite">
          <div class="splash-scene">
            <div class="splash-truck">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" />
                <path d="M15 18H9" />
                <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" />
                <circle cx="17" cy="18" r="2" />
                <circle cx="7" cy="18" r="2" />
              </svg>
            </div>
            <div class="splash-road"></div>
          </div>
          <div class="splash-brand">ESCORT<span>in</span>Road</div>
          <div class="splash-tag">TRANSPORTE E LOGÍSTICA</div>
          <div class="splash-bar"><div></div></div>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
